name: Build YSFlight with telemetry patch

# Запуск вручную: вкладка Actions -> "Build YSFlight with telemetry patch" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Файлы с Windows-окончаниями строк ломают git apply, поэтому отключаем преобразование заранее
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Get patch (this repository)
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: Clone YSFlight sources
        run: |
          git clone --depth 1 https://github.com/captainys/public.git public
          git clone --depth 1 https://github.com/captainys/YSFLIGHT.git YSFLIGHT

      - name: Apply telemetry patch
        working-directory: YSFLIGHT
        run: git apply --ignore-whitespace --verbose ../patchrepo/ysf_telemetry.patch

      - name: Configure (MSVC, x64)
        working-directory: YSFLIGHT
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          mkdir build
          cd build
          cmake ../src -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      # Собираем только основную игру (OpenGL 2). Остальные цели (сервер, демо, gl1) не нужны.
      # continue-on-error: если код возврата сборки ненулевой из-за побочной команды, ниже проверяем сам .exe
      - name: Build ysflight64_gl2 (Release)
        id: build
        continue-on-error: true
        working-directory: YSFLIGHT/build
        run: cmake --build . --config Release --parallel --target ysflight64_gl2 2>&1 | Tee-Object -FilePath ../build_log.txt

      - name: Check result
        id: check
        shell: pwsh
        run: |
          $dir = "YSFLIGHT/build/main/Release"
          Write-Host "Build step outcome: ${{ steps.build.outcome }}"
          Get-ChildItem "$dir/*" -Include *.exe -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table
          Write-Host "plugin folder:"
          Get-ChildItem "$dir/plugin" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table
          if (-not (Test-Path "$dir/ysflight64_gl2.exe")) {
            Write-Host "::error::ysflight64_gl2.exe не собран. Ошибки компиляции ниже:"
            Select-String -Path YSFLIGHT/build_log.txt -Pattern "error C|error LNK|fatal error|: error " | Select-Object -First 40 | ForEach-Object { $_.Line }
            exit 1
          }
          Write-Host "OK: ysflight64_gl2.exe собран"

      - name: Upload exe and DLLs
        uses: actions/upload-artifact@v4
        with:
          name: ysflight-with-telemetry
          path: |
            YSFLIGHT/build/main/Release/ysflight64_gl2.exe
            YSFLIGHT/build/main/Release/plugin/*.dll
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: YSFLIGHT/build_log.txt
          if-no-files-found: ignore
